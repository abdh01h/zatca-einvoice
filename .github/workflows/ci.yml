name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, openssl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer analyse
      - run: composer test

  xsd:
    name: ZATCA XSD conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, openssl
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php tests/tools/validate-xsd.php
